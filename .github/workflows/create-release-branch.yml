name: Create release branch

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    environment: release
    env:
      NX_DAEMON: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org/"

      - name: Install deps
        run: yarn

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate new version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BUMP_TYPE="${{ github.event.inputs.bump_type }}"

          # Get current version from package.json
          CURRENT_VERSION=$(node -e "console.log(require('./libs/vectoriadb/package.json').version)")
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Calculate new version based on bump type
          case "$BUMP_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Apply version bump via Nx Release
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "Bumping vectoriadb to version $NEW_VERSION"

          # Use Nx Release to bump version
          npx nx release version "$NEW_VERSION" --projects=vectoriadb --git-commit=false --git-tag=false

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TODAY=$(date -u +"%Y-%m-%d")

          # Update libs/vectoriadb/CHANGELOG.md
          CHANGELOG_PATH="libs/vectoriadb/CHANGELOG.md"
          if [ -f "$CHANGELOG_PATH" ]; then
            # Add new version entry after [Unreleased]
            sed -i.bak "s/## \[Unreleased\]/## [Unreleased]\n\n## [$NEW_VERSION] - $TODAY/" "$CHANGELOG_PATH"
            rm -f "${CHANGELOG_PATH}.bak"
            echo "Updated $CHANGELOG_PATH"
          fi

          # Update root CHANGELOG.md
          ROOT_CHANGELOG="CHANGELOG.md"
          if [ -f "$ROOT_CHANGELOG" ]; then
            sed -i.bak "s/## \[Unreleased\]/## [Unreleased]\n\n## [$NEW_VERSION] - $TODAY/" "$ROOT_CHANGELOG"
            rm -f "${ROOT_CHANGELOG}.bak"
            echo "Updated $ROOT_CHANGELOG"
          fi

      - name: Create release branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          BRANCH_NAME="next/$NEW_VERSION"

          git fetch origin main --tags
          git switch -c "$BRANCH_NAME" origin/main

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Created branch: $BRANCH_NAME"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          BUMP_TYPE="${{ steps.version.outputs.bump_type }}"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): prepare release v$NEW_VERSION" \
              -m "Version bump type: $BUMP_TYPE"
            echo "Created release preparation commit"
          else
            echo "No changes to commit"
            git commit --allow-empty -m "chore(release): prepare release v$NEW_VERSION"
          fi

      - name: Push branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          BUMP_TYPE="${{ steps.version.outputs.bump_type }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          BASE="main"
          TITLE="Release v$NEW_VERSION"

          # Check for existing PR
          EXISTING_PR=$(gh pr list \
            --base "$BASE" \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number' || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists"
            exit 0
          fi

          # Create PR body
          BODY=$(cat <<EOF
          ## Release v$NEW_VERSION

          ### Version bump
          - **Type**: $BUMP_TYPE
          - **Package**: vectoriadb

          ---
          Merge this PR to publish vectoriadb to npm.
          EOF
          )

          gh pr create \
            --base "$BASE" \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "$BODY"

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ steps.version.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
