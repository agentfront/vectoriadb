name: Publish on next/* merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-next-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'next/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: release
    env:
      NX_DAEMON: "false"

    steps:
      - name: Determine release ref
        id: release_ref
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ -n "${MERGE_SHA:-}" ] && [ "$MERGE_SHA" != "null" ]; then
            REF="$MERGE_SHA"
          else
            REF="$BASE_REF"
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_ref.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org/"

      - name: Update npm CLI for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Determine release SHA
        id: release_sha
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [ -n "${MERGE_SHA:-}" ] && [ "$MERGE_SHA" != "null" ]; then
            SHA="$MERGE_SHA"
          else
            SHA=$(git rev-parse HEAD)
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: get_version
        shell: bash
        run: |
          LIB_VERSION=$(./scripts/get-lib-version.sh vectoriadb)
          echo "version=$LIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $LIB_VERSION"

      - name: Configure git user
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create git tag
        shell: bash
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.release_sha.outputs.sha }}"
          LIB_VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="vectoriadb@${LIB_VERSION}"

          git fetch --tags

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
          else
            echo "Creating tag $TAG_NAME at $TARGET_SHA"
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Build package
        run: npx nx run vectoriadb:build

      - name: Publish to npm via Nx Release
        shell: bash
        run: |
          set -euo pipefail
          echo "Publishing vectoriadb via Nx Release..."
          npx nx release publish --projects=vectoriadb

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LIB_VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="vectoriadb@${LIB_VERSION}"

          echo "Creating GitHub Release for $TAG_NAME..."

          # Extract changelog entry for this version
          CHANGELOG_PATH="libs/vectoriadb/CHANGELOG.md"
          CHANGELOG_ENTRY=""
          if [ -f "$CHANGELOG_PATH" ]; then
            CHANGELOG_ENTRY=$(node -e "
              const fs = require('fs');
              const content = fs.readFileSync('$CHANGELOG_PATH', 'utf8');
              const version = '$LIB_VERSION';
              const pattern = new RegExp('## \\\\[' + version.replace(/\\./g, '\\\\.') + '\\\\][^\\n]*\\n([\\\\s\\\\S]*?)(?=\\n## \\\\[|$)');
              const match = content.match(pattern);
              if (match) {
                console.log(match[1].trim());
              }
            " 2>/dev/null || echo "")
          fi

          # Build release body
          BODY="## vectoriadb v${LIB_VERSION}"
          BODY+=$'\n\n'
          BODY+="**npm:** [\`vectoriadb@${LIB_VERSION}\`](https://www.npmjs.com/package/vectoriadb/v/${LIB_VERSION})"

          if [ -n "$CHANGELOG_ENTRY" ]; then
            BODY+=$'\n\n---\n\n'
            BODY+="$CHANGELOG_ENTRY"
          fi

          # Create release using gh CLI (check if exists first)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, skipping..."
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "$BODY"
          fi

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail

          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Published:** vectoriadb@${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release commit:** ${{ steps.release_sha.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
